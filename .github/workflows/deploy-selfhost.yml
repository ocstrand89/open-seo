name: Deploy self-host

# Deploys this fork's self-host stage to Cloudflare from CI, so a deploy needs
# nothing but a browser. `pnpm alchemy login` is a laptop flow; CI authenticates
# with CLOUDFLARE_API_TOKEN instead, exactly as the upstream preview workflow
# does.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  Workers Scripts / KV / D1 / R2 / Workflows write,
#                         Secrets Store read and Account Settings read (those
#                         two are how alchemy fetches its state-store token),
#                         Access: Apps and Policies write, plus DNS write on
#                         the zone SELFHOST_DOMAIN belongs to.
#   CLOUDFLARE_ACCOUNT_ID The account the Worker deploys into.
#   ENV_SELFHOST          The whole contents of .env.selfhost, including
#                         DATAFORSEO_API_KEY. Written to disk on the runner and
#                         thrown away with it.
#   GOOGLE_CLIENT_ID      Search Console and Analytics. Each one overrides the
#   GOOGLE_CLIENT_SECRET  same key in ENV_SELFHOST, and the deploy fails when
#   BETTER_AUTH_SECRET    any of the three is still empty after that, because
#                         alchemy would otherwise deploy the Worker without
#                         them and silently disconnect both integrations.
#
# The upstream repository never runs this file: the gate below pins it to this
# fork, so a synced copy stays inert anywhere else.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Nothing here can change what gets deployed.
    paths-ignore:
      - "**/*.md"
      - docs/**
      - runbooks/**
      - .agents/**
      - web/**
      - badseo/**

# One deploy at a time, and never cancel one midway: alchemy is applying real
# resources.
concurrency:
  group: deploy-selfhost
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    if: github.repository == 'ocstrand89/open-seo'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env.selfhost
        run: printf '%s' "$ENV_SELFHOST" > .env.selfhost
        env:
          ENV_SELFHOST: ${{ secrets.ENV_SELFHOST }}

      # The Google credentials live in their own repository secrets so editing
      # ENV_SELFHOST (which GitHub never shows back) cannot drop them. A value
      # here wins over the same key in ENV_SELFHOST.
      - name: Add the Google credentials
        run: |
          [ -z "$(tail -c1 .env.selfhost)" ] || echo >> .env.selfhost
          for key in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET BETTER_AUTH_SECRET; do
            value="${!key}"
            if [ -n "$value" ]; then
              sed -i "/^${key}=/d" .env.selfhost
              printf '%s=%s\n' "$key" "$value" >> .env.selfhost
            fi
            grep -qE "^${key}=." .env.selfhost ||
              { echo "::error::${key} is empty. Set it as a repository secret."; exit 1; }
          done
          grep -qE '^BETTER_AUTH_SECRET=.{32,}' .env.selfhost ||
            { echo "::error::BETTER_AUTH_SECRET must be at least 32 characters."; exit 1; }
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      # Fail on an empty or malformed secret before spending a build on it.
      - name: Check the deploy inputs
        run: |
          for key in DATAFORSEO_API_KEY ACCESS_ALLOWED_EMAILS; do
            grep -qE "^${key}=." .env.selfhost ||
              { echo "::error::ENV_SELFHOST is missing ${key}"; exit 1; }
          done
          domain=$(grep -E '^SELFHOST_DOMAIN=.' .env.selfhost | cut -d= -f2- || true)
          echo "SELFHOST_DOMAIN=${domain}" >> "$GITHUB_ENV"

      # Same command as a laptop deploy. `--yes` also lets alchemy deploy its
      # state store unattended on the very first run.
      - name: Deploy
        run: pnpm deploy:selfhost --yes

      # The Access gate is the only thing between the internet and your SEO
      # data, so prove it is in front of the deployed hostname. A plain 2xx
      # means the app answered without asking anyone to log in.
      # Access redirects a browser (Accept: text/html) to its login page, and
      # answers other clients 401 with a www-authenticate header naming its
      # protected-resource metadata. Either one means the gate is there.
      - name: Verify the Access gate
        if: env.SELFHOST_DOMAIN != ''
        run: |
          headers=$(mktemp)
          for attempt in 1 2 3 4 5 6 7 8; do
            : > "$headers"
            response=$(curl -sS -o /dev/null -D "$headers" -m 10 \
              -H 'Accept: text/html' -w '%{http_code} %{redirect_url}' \
              "https://${SELFHOST_DOMAIN}") || response=""
            code="${response%% *}"
            location="${response#* }"
            case "$location" in
              *cloudflareaccess.com*)
                echo "Access gate is in front of https://${SELFHOST_DOMAIN}"
                exit 0
                ;;
            esac
            if [ "$code" = "401" ] && grep -qi '^www-authenticate:.*cloudflare-access-protected-resource' "$headers"; then
              echo "Access gate is in front of https://${SELFHOST_DOMAIN}"
              exit 0
            fi
            case "$code" in
              2*|3*)
                echo "::error::https://${SELFHOST_DOMAIN} answered ${code} without an Access login redirect"
                exit 1
                ;;
            esac
            echo "attempt ${attempt}: ${code:-no response}, waiting for propagation"
            sleep 15
          done
          echo "::error::https://${SELFHOST_DOMAIN} never answered"
          exit 1
