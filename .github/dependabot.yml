version: 2
updates:
  # pnpm projects use the npm ecosystem; Dependabot reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches minimumReleaseAge (8 days) in pnpm-workspace.yaml, so a PR
    # never proposes a version `pnpm install` would refuse.
    cooldown:
      default-days: 8
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
